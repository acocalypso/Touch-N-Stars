<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="/Logo_TouchNStars_150x150.png" />
    <title>TouchNStars</title>
    <!-- Inline on purpose: the dark ground also lives in tailwind.css, but that
         stylesheet only applies once it has loaded. Every full page load (app
         start, instance switch) would paint a white frame first. Keep this value
         in sync with --color-ground in src/assets/tailwind.css. -->
    <style>
      html,
      body {
        background-color: #0a0f1c;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <noscript>
      <strong>
        We're sorry but TouchNStars doesn't work properly without JavaScript enabled.
        Please enable it to continue.
      </strong>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
