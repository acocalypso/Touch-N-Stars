<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Hardware-DB Review</title>
    <style>
      :root {
        --paper: #eef1f5;
        --surface: #ffffff;
        --sunk: #e4e9f0;
        --ink: #141a23;
        --ink-soft: #4a5566;
        --ink-faint: #6f7c8f;
        --rule: #d3dae4;
        --accent: #1f5fa9;
        --accent-soft: #e3ecf8;
        --ok: #1c6b47;
        --ok-soft: #dff0e6;
        --danger: #a3282c;
        --danger-soft: #fae5e4;
        --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, monospace;
        --sans: ui-sans-serif, system-ui, 'Segoe UI', Roboto, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0d1219;
          --surface: #151c25;
          --sunk: #1c242f;
          --ink: #e6ecf4;
          --ink-soft: #a9b6c7;
          --ink-faint: #7d8b9e;
          --rule: #29323e;
          --accent: #74a9e8;
          --accent-soft: #17263a;
          --ok: #71c79c;
          --ok-soft: #14291f;
          --danger: #e98b8b;
          --danger-soft: #33191b;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 15px;
        line-height: 1.55;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.85rem 1.25rem;
        background: var(--surface);
        border-bottom: 1px solid var(--rule);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      header h1 {
        margin: 0;
        font-size: 1.05rem;
        letter-spacing: -0.01em;
      }
      header .sub {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .tabs {
        display: flex;
        gap: 0.3rem;
      }
      .tabs button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      main {
        padding: 1.25rem;
        max-width: 90rem;
        margin: 0 auto;
      }
      .cols {
        display: grid;
        grid-template-columns: minmax(15rem, 21rem) 1fr;
        gap: 1.25rem;
        align-items: start;
      }
      @media (max-width: 60rem) {
        .cols {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--rule);
        border-radius: 6px;
        padding: 1rem 1.1rem;
      }
      h2 {
        margin: 0 0 0.6rem;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
      }
      h3 {
        margin: 1.1rem 0 0.5rem;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--ink-faint);
      }
      label {
        display: block;
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin-bottom: 0.2rem;
      }
      input,
      select,
      textarea {
        width: 100%;
        padding: 0.45rem 0.55rem;
        font: inherit;
        font-size: 0.9rem;
        color: var(--ink);
        background: var(--paper);
        border: 1px solid var(--rule);
        border-radius: 4px;
      }
      input:disabled,
      select:disabled,
      textarea:disabled {
        opacity: 0.6;
      }
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button {
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        padding: 0.5rem 0.9rem;
        border-radius: 4px;
        border: 1px solid var(--rule);
        background: var(--sunk);
        color: var(--ink);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--ink-faint);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button.danger {
        background: var(--danger-soft);
        border-color: var(--danger);
        color: var(--danger);
      }
      button.small {
        font-size: 0.8rem;
        padding: 0.35rem 0.65rem;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        max-height: 70vh;
        overflow-y: auto;
      }
      .list button {
        text-align: left;
        font-weight: 500;
        background: var(--surface);
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
      }
      .list button.active {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      .list .tok {
        font-family: var(--mono);
        font-size: 0.75rem;
        color: var(--ink-faint);
      }
      pre {
        margin: 0;
        padding: 0.7rem 0.8rem;
        background: var(--sunk);
        border: 1px solid var(--rule);
        border-radius: 4px;
        font-family: var(--mono);
        font-size: 0.75rem;
        line-height: 1.6;
        overflow: auto;
        max-height: 24rem;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        margin-bottom: 0.8rem;
      }
      .chip {
        font-family: var(--mono);
        font-size: 0.72rem;
        padding: 0.15rem 0.5rem;
        border: 1px solid var(--rule);
        border-radius: 3px;
        color: var(--ink-soft);
        background: var(--sunk);
      }
      .block {
        border: 1px solid var(--rule);
        border-radius: 5px;
        padding: 0.85rem 0.95rem;
        margin-bottom: 0.8rem;
        background: var(--surface);
      }
      .block.done {
        border-color: var(--ok);
        background: var(--ok-soft);
      }
      .block-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        margin-bottom: 0.7rem;
      }
      .block-head strong {
        font-size: 0.95rem;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr));
        gap: 0.6rem;
      }
      .full {
        grid-column: 1 / -1;
      }
      .row-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 0.7rem;
      }

      /* ---- merge view ---- */
      .match {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem 0.75rem;
        padding: 0.5rem 0.7rem;
        margin-bottom: 0.75rem;
        border-radius: 4px;
        font-size: 0.85rem;
      }
      .match.known {
        background: var(--accent-soft);
        border: 1px solid var(--accent);
      }
      .match.new {
        background: var(--ok-soft);
        border: 1px solid var(--ok);
        color: var(--ok);
      }
      .match select {
        width: auto;
        flex: 1;
        min-width: 12rem;
      }
      .diff {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 0.4rem 0.6rem;
        align-items: center;
        padding: 0.5rem 0.6rem;
        border: 1px solid var(--rule);
        border-radius: 4px;
        margin-bottom: 0.45rem;
        background: var(--sunk);
      }
      @media (max-width: 44rem) {
        .diff {
          grid-template-columns: 1fr;
        }
      }
      .diff-field {
        grid-column: 1 / -1;
        font-family: var(--mono);
        font-size: 0.68rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .diff-side {
        font-size: 0.88rem;
        word-break: break-word;
      }
      .diff-side .tag {
        display: block;
        font-family: var(--mono);
        font-size: 0.65rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--ink-faint);
      }
      .diff-side.old {
        color: var(--danger);
      }
      .diff-side.new {
        color: var(--ok);
      }
      .diff-side em {
        color: var(--ink-faint);
        font-style: italic;
      }
      .seg {
        display: flex;
        border: 1px solid var(--rule);
        border-radius: 4px;
        overflow: hidden;
      }
      .seg button {
        border: 0;
        border-radius: 0;
        font-size: 0.78rem;
        padding: 0.3rem 0.6rem;
        background: var(--surface);
        color: var(--ink-soft);
      }
      .seg button[aria-pressed='true'] {
        background: var(--accent);
        color: #fff;
      }
      .existing-note {
        padding: 0.45rem 0.6rem;
        margin-bottom: 0.35rem;
        border-radius: 4px;
        background: var(--sunk);
        border-left: 2px solid var(--ink-faint);
        font-size: 0.85rem;
        color: var(--ink-soft);
      }
      .choice {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.4rem 0.8rem;
        margin-top: 0.4rem;
        font-size: 0.85rem;
      }
      .choice label {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        margin: 0;
        font-family: var(--sans);
        font-size: 0.85rem;
        letter-spacing: 0;
        text-transform: none;
        color: var(--ink);
      }
      .choice input[type='radio'] {
        width: auto;
      }
      .choice select {
        width: auto;
        flex: 1;
        min-width: 10rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-top: 1rem;
        padding-top: 0.9rem;
        border-top: 1px solid var(--rule);
      }
      .toast {
        padding: 0.6rem 0.8rem;
        border-radius: 4px;
        font-size: 0.88rem;
        margin-bottom: 0.9rem;
        border: 1px solid var(--rule);
      }
      .toast.err {
        background: var(--danger-soft);
        border-color: var(--danger);
        color: var(--danger);
      }
      .toast.ok {
        background: var(--ok-soft);
        border-color: var(--ok);
        color: var(--ok);
      }
      .empty {
        color: var(--ink-faint);
        font-size: 0.9rem;
      }
      .login {
        max-width: 22rem;
        margin: 4rem auto;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }
      .hide {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Hardware-DB Review</h1>
        <div class="sub" id="hdrSub">nicht angemeldet</div>
      </div>
      <div class="tabs hide" id="tabs">
        <button id="tabQueue" class="active">Warteschlange</button>
        <button id="tabEntries">Einträge</button>
      </div>
      <div style="display: flex; gap: 0.5rem">
        <button id="btnReload" class="hide">Neu laden</button>
        <button id="btnLogout" class="hide">Abmelden</button>
      </div>
    </header>

    <main>
      <div id="toast"></div>

      <form class="login card" id="loginForm">
        <h2>Anmelden</h2>
        <div>
          <label for="email">Superuser E-Mail</label>
          <input id="email" type="email" autocomplete="username" required />
        </div>
        <div>
          <label for="pass">Passwort</label>
          <input id="pass" type="password" autocomplete="current-password" required />
        </div>
        <button class="primary" type="submit">Anmelden</button>
      </form>

      <!-- Queue: unreviewed submissions -->
      <div class="cols hide" id="viewQueue">
        <section class="card">
          <h2>Offene Reports (<span id="count">0</span>)</h2>
          <div class="list" id="queue"></div>
        </section>
        <section id="detail">
          <div class="card empty">Links einen Report auswählen.</div>
        </section>
      </div>

      <!-- Entries: everything already published -->
      <div class="cols hide" id="viewEntries">
        <section class="card">
          <h2>Geräte (<span id="deviceCount">0</span>)</h2>
          <input id="deviceSearch" placeholder="Suchen…" style="margin-bottom: 0.6rem" />
          <div class="list" id="deviceList"></div>
        </section>
        <section id="entryDetail">
          <div class="card empty">Links ein Gerät auswählen.</div>
        </section>
      </div>
    </main>

    <script>
      // Same origin as the API, so no base URL and no CORS to worry about.
      const API = '';
      const CATEGORIES = [
        'camera',
        'mount',
        'focuser',
        'filterwheel',
        'rotator',
        'guider',
        'flatdevice',
        'switch',
        'weather',
        'dome',
        'safetymonitor',
      ];
      const STATUSES = ['works', 'caveat', 'broken'];
      // Which software stack drove the device. PHD2 has its own driver list, so
      // "works under INDI" says nothing about whether PHD2 can talk to it.
      const STACKS = ['pins', 'phd2'];

      /** Anything that is not PHD2 came through the PINS side of the rig. */
      function stackOf(value) {
        return value === 'phd2' ? 'phd2' : 'pins';
      }

      let token = sessionStorage.getItem('hwReviewToken') || '';
      let submissions = [];
      let current = null;
      // Indices of devices already taken over from the open submission. Kept in
      // memory only: a page reload starts the submission over, which is safe
      // because taking a device over twice just bumps its report counter.
      let takenDevices = new Set();

      let devices = [];
      let entries = [];
      let notes = [];
      let currentDeviceId = '';

      const $ = (id) => document.getElementById(id);

      function toast(msg, kind) {
        $('toast').innerHTML = msg ? `<div class="toast ${kind || ''}">${esc(msg)}</div>` : '';
      }

      function esc(s) {
        return String(s ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
        );
      }

      function options(values, selected) {
        return values
          .map((v) => `<option value="${v}"${v === selected ? ' selected' : ''}>${v}</option>`)
          .join('');
      }

      async function api(path, opts = {}) {
        const res = await fetch(API + path, {
          ...opts,
          headers: {
            'Content-Type': 'application/json',
            ...(token ? { Authorization: token } : {}),
            ...(opts.headers || {}),
          },
        });
        const text = await res.text();
        const data = text ? JSON.parse(text) : null;
        if (!res.ok) {
          const field = data?.data && Object.values(data.data)[0];
          throw new Error(field?.message || data?.message || `HTTP ${res.status}`);
        }
        return data;
      }

      async function findOne(collection, filter) {
        const res = await api(
          `/api/collections/${collection}/records?perPage=1&filter=` + encodeURIComponent(filter)
        );
        return res.items?.[0] || null;
      }

      /** PocketBase filters are single-quoted, so a quote in a value must escape. */
      function q(v) {
        return String(v).replace(/'/g, "\\'");
      }

      /* ---------- auth ---------- */

      $('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        toast('');
        try {
          const res = await api('/api/collections/_superusers/auth-with-password', {
            method: 'POST',
            body: JSON.stringify({ identity: $('email').value, password: $('pass').value }),
          });
          token = res.token;
          sessionStorage.setItem('hwReviewToken', token);
          $('hdrSub').textContent = res.record?.email || 'angemeldet';
          showApp();
          await loadPending();
        } catch (err) {
          toast('Anmeldung fehlgeschlagen: ' + err.message, 'err');
        }
      });

      $('btnLogout').addEventListener('click', () => {
        token = '';
        sessionStorage.removeItem('hwReviewToken');
        location.reload();
      });

      $('btnReload').addEventListener('click', () =>
        $('tabQueue').classList.contains('active') ? loadPending() : loadEntries()
      );

      function showApp() {
        $('loginForm').classList.add('hide');
        $('tabs').classList.remove('hide');
        $('btnReload').classList.remove('hide');
        $('btnLogout').classList.remove('hide');
        switchTab('queue');
      }

      /* ---------- tabs ---------- */

      $('tabQueue').onclick = () => switchTab('queue');
      $('tabEntries').onclick = () => switchTab('entries');

      function switchTab(name) {
        const isQueue = name === 'queue';
        $('tabQueue').classList.toggle('active', isQueue);
        $('tabEntries').classList.toggle('active', !isQueue);
        $('viewQueue').classList.toggle('hide', !isQueue);
        $('viewEntries').classList.toggle('hide', isQueue);
        toast('');
        if (!isQueue && !devices.length) loadEntries();
      }

      /* ---------- queue ---------- */

      async function loadPending() {
        toast('');
        try {
          const res = await api(
            '/api/collections/hw_submissions/records?perPage=200&sort=-created&filter=' +
              encodeURIComponent("status='pending'")
          );
          submissions = res.items || [];
          renderQueue();
        } catch (err) {
          toast('Laden fehlgeschlagen: ' + err.message, 'err');
        }
      }

      function renderQueue() {
        $('count').textContent = submissions.length;
        const list = $('queue');
        list.innerHTML = '';
        if (!submissions.length) {
          list.innerHTML = '<p class="empty">Keine offenen Reports.</p>';
          $('detail').innerHTML = '<div class="card empty">Nichts zu tun.</div>';
          return;
        }
        submissions.forEach((s) => {
          const b = document.createElement('button');
          const count = s.payload?.devices?.length || 0;
          b.innerHTML =
            `<span>${count} Gerät${count === 1 ? '' : 'e'} · ${esc(s.payload?.client?.mode || '?')}</span>` +
            `<span class="tok">${esc(s.reportToken)}</span>`;
          b.onclick = () => selectSubmission(s.id);
          if (current?.id === s.id) b.classList.add('active');
          list.appendChild(b);
        });
      }

      /* ---------- prefill helpers ---------- */

      function slugify(s) {
        return String(s || '')
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, '-')
          .replace(/^-+|-+$/g, '');
      }

      /**
       * Removes the rig-specific USB suffix a driver may append, e.g. the
       * "(7c-2-2-3)" in "ToupTek ATR585M (7c-2-2-3)". It is a fragment of the
       * driver's DeviceId and encodes which USB port the device is plugged into,
       * so it differs between two users owning the same model. Kept in sync with
       * stripHardwareSuffix() in ../utils/snapshotSerializer.js, which removes it
       * on the submitting side.
       */
      function stripHardwareSuffix(value) {
        return String(value || '')
          .replace(/\s*\([0-9a-f]+(?:[-:._][0-9a-f]+)+\)\s*$/i, '')
          .trim();
      }

      /**
       * The vendor usually lives only in displayName ("ToupTek ATR585M"), while
       * name carries the bare model ("ATR585M"). Splitting on that overlap gets
       * it right for most drivers; anything odd is fixed in the form.
       */
      /**
       * Collapses a name to a comparable form. Must stay identical to
       * normalizeDeviceName() in ../utils/snapshotSerializer.js — the submitting
       * side stores names normalized this way, and a divergence here would make
       * matching silently miss.
       */
      function normalizeName(value) {
        return String(value || '')
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9]+/g, ' ')
          .trim();
      }

      /**
       * Finds the published device a submitted one refers to. Matching by slug
       * alone is what produced the first duplicate: the reviewer corrects the
       * model, the slug changes with it, and the match is lost.
       */
      function findDeviceMatch({ vendor, model, slug }) {
        const bySlug = devices.find((d) => d.slug === slug);
        if (bySlug) return bySlug;

        const full = normalizeName(`${vendor} ${model}`);
        const bare = normalizeName(model);

        return (
          devices.find((d) => normalizeName(`${d.vendor} ${d.model}`) === full) ||
          devices.find((d) => normalizeName(d.model) === bare) ||
          devices.find((d) =>
            (Array.isArray(d.aliases) ? d.aliases : []).some((a) => {
              const alias = normalizeName(a);
              return alias && (alias === full || alias === bare);
            })
          ) ||
          null
        );
      }

      /**
       * One diff row. Rendered only when the values differ; the default keeps
       * the stored value, because the reviewer curates the database and raw
       * incoming data must not silently displace curated content. The exception
       * is an empty stored value, where there is nothing to protect.
       */
      function diffRow(key, label, oldValue, newValue) {
        if (String(oldValue || '') === String(newValue || '')) return '';
        const takeByDefault = !String(oldValue || '').trim();
        return `
          <div class="diff">
            <span class="diff-field">${esc(label)}</span>
            <span class="diff-side old">
              <span class="tag">Bestand</span>${oldValue ? esc(oldValue) : '<em>leer</em>'}
            </span>
            <span class="diff-side new">
              <span class="tag">Neu</span>${newValue ? esc(newValue) : '<em>leer</em>'}
            </span>
            <span class="seg" data-diff="${key}">
              <button data-choice="keep" aria-pressed="${!takeByDefault}">Behalten</button>
              <button data-choice="take" aria-pressed="${takeByDefault}">Übernehmen</button>
            </span>
          </div>`;
      }

      /** Segmented controls act as radio groups; state lives in aria-pressed. */
      document.addEventListener('click', (event) => {
        const button = event.target.closest('.seg button');
        if (!button) return;
        [...button.parentElement.children].forEach((child) =>
          child.setAttribute('aria-pressed', String(child === button))
        );
      });

      /** Reads a segmented control back; absent row means "no difference". */
      function choice(scope, key, fallback = 'keep') {
        const pressed = scope.querySelector(`[data-diff="${key}"] [aria-pressed="true"]`);
        return pressed?.dataset.choice || fallback;
      }

      function splitVendorModel(dev) {
        const display = stripHardwareSuffix(
          (dev.displayName || '').replace(/\s*\(\s*INDI\s*\)\s*$/i, '').trim()
        );
        const name = stripHardwareSuffix(dev.name);
        if (display && name && display.toLowerCase().endsWith(name.toLowerCase())) {
          const vendor = display.slice(0, display.length - name.length).trim();
          if (vendor) return { vendor, model: name };
        }
        const source = display || name;
        const parts = source.split(/\s+/);
        if (parts.length > 1) return { vendor: parts[0], model: parts.slice(1).join(' ') };
        return { vendor: '', model: source };
      }

      /* ---------- submission detail ---------- */

      async function selectSubmission(id) {
        current = submissions.find((s) => s.id === id) || null;
        takenDevices = new Set();
        renderQueue();
        // Matching needs the published data; the entries tab loads the same
        // three collections, so the caches are shared.
        if (!devices.length) await loadEntries();
        renderDetail();
      }

      function renderDetail() {
        if (!current) return;
        const p = current.payload || {};
        const list = Array.isArray(p.devices) ? p.devices : [];

        const meta = [
          p.client?.mode,
          p.client?.platform,
          p.client?.tnsVersion && 'TNS ' + p.client.tnsVersion,
          p.backend?.pinsVersion && 'PINS ' + p.backend.pinsVersion,
          p.backend?.arch,
          new Date(current.created).toLocaleString(),
        ]
          .filter(Boolean)
          .map((t) => `<span class="chip">${esc(t)}</span>`)
          .join('');

        // One card per device, each with its own button: a submission may mix a
        // useful camera with a simulator, and they should not share a fate.
        const cards = list.map((d, i) => deviceCard(d, i)).join('');

        $('detail').innerHTML = `
          <div class="card">
            <h2>${esc(current.reportToken)}</h2>
            <div class="meta">${meta}</div>
            ${list.length ? cards : '<p class="empty">Dieser Report enthält keine Geräte.</p>'}
            <div class="actions">
              <button class="primary" id="btnDone">Report abschließen (${takenDevices.size}/${list.length})</button>
              <button id="btnDup">Duplikat</button>
              <button class="danger" id="btnRej">Ablehnen</button>
            </div>
            <details style="margin-top: 1rem">
              <summary style="cursor: pointer; font-size: 0.85rem; color: var(--ink-faint)">
                Roh-Payload
              </summary>
              <pre style="margin-top: 0.5rem">${esc(JSON.stringify(p, null, 2))}</pre>
            </details>
          </div>`;

        list.forEach((d, i) => {
          if (!takenDevices.has(i)) $('take' + i).onclick = () => takeDevice(i);
        });
        $('btnDone').onclick = () => setStatus('approved');
        $('btnDup').onclick = () => setStatus('duplicate');
        $('btnRej').onclick = () => setStatus('rejected');
      }

      /**
       * One incoming device, merged against what is already published. Fields
       * that are identical produce no row: the card shows differences only, so
       * a repeat report of a known device is a handful of lines rather than a
       * full form to re-read.
       */
      function deviceCard(d, i) {
        const { vendor, model } = splitVendorModel(d);
        const slug = slugify(`${vendor} ${model}`);
        const driver = d.driverInfo || '';
        const taken = takenDevices.has(i);
        const off = taken ? 'disabled' : '';

        // The plugin already tells us which stack the device was driven by.
        const incomingStack = stackOf(d.connectionType);

        const match = findDeviceMatch({ vendor, model, slug });
        const entry = match
          ? entries.find(
              (e) =>
                e.device === match.id &&
                normalizeName(e.driver) === normalizeName(driver) &&
                stackOf(e.stack) === incomingStack
            )
          : null;
        const deviceEntries = match ? entries.filter((e) => e.device === match.id) : [];
        const entryNotes = entry ? notes.filter((n) => n.entry === entry.id) : [];

        const head = match
          ? `<div class="match known">
               <span>Bereits erfasst</span>
               <select id="link${i}" ${off}>
                 ${devices
                   .map(
                     (dev) =>
                       `<option value="${dev.id}"${dev.id === match.id ? ' selected' : ''}>${esc(
                         [dev.vendor, dev.model].filter(Boolean).join(' ')
                       )}</option>`
                   )
                   .join('')}
                 <option value="">— Neues Gerät anlegen —</option>
               </select>
             </div>`
          : `<div class="match new"><span>Neues Gerät</span></div>`;

        // Only the fields the reviewer may still want to change are editable;
        // everything else is decided through the diff rows below.
        const form = `
          <div class="grid">
            <div><label>Vendor</label><input id="vendor${i}" value="${esc(vendor)}" ${off} /></div>
            <div><label>Model</label><input id="model${i}" value="${esc(model)}" ${off} /></div>
            <div><label>Slug</label><input id="slug${i}" value="${esc(slug)}" ${off} /></div>
            <div><label>Kategorie</label><select id="cat${i}" ${off}>${options(CATEGORIES, d.category)}</select></div>
            <div>
              <label>Treiber</label>
              <input id="drv${i}" value="${esc(driver)}" list="drivers${i}" ${off} />
              <datalist id="drivers${i}">
                ${deviceEntries.map((e) => `<option value="${esc(e.driver)}"></option>`).join('')}
              </datalist>
            </div>
            <div><label>Status</label><select id="st${i}" ${off}>${options(STATUSES, d.userStatus)}</select></div>
            <div>
              <label>Stack</label>
              <select id="stack${i}" ${off}>${options(STACKS, incomingStack)}</select>
            </div>
          </div>`;

        const deviceDiff = match
          ? diffRow('vendor', 'Vendor', match.vendor, vendor) +
            diffRow('model', 'Model', match.model, model) +
            diffRow('slug', 'Slug', match.slug, slug) +
            diffRow('category', 'Kategorie', match.category, d.category)
          : '';

        // Recording the incoming spelling as an alias is what makes the next
        // report of the same device match without any manual work.
        const incomingName = stripHardwareSuffix(d.displayName || d.name || '');
        const knownAliases = match ? (Array.isArray(match.aliases) ? match.aliases : []) : [];
        const aliasWorthAdding =
          match &&
          incomingName &&
          normalizeName(incomingName) !== normalizeName(`${match.vendor} ${match.model}`) &&
          !knownAliases.some((a) => normalizeName(a) === normalizeName(incomingName));
        const aliasRow = aliasWorthAdding
          ? `<div class="diff">
               <span class="diff-field">Alias</span>
               <span class="diff-side old"><span class="tag">Bestand</span>${
                 knownAliases.length ? esc(knownAliases.join(', ')) : '<em>keine</em>'
               }</span>
               <span class="diff-side new"><span class="tag">Ergänzen</span>${esc(incomingName)}</span>
               <span class="seg" data-diff="alias">
                 <button data-choice="keep" aria-pressed="false">Nein</button>
                 <button data-choice="take" aria-pressed="true">Ergänzen</button>
               </span>
             </div>`
          : '';

        const entryDiff = entry
          ? `<h3>Treiber-Eintrag</h3>
             <p class="empty">Meldungen: ${entry.reportCount || 0} → ${(entry.reportCount || 0) + 1}</p>
             ${diffRow('status', 'Status', entry.status, d.userStatus)}
             ${diffRow('stack', 'Stack', stackOf(entry.stack), incomingStack)}
             ${diffRow('minPinsVersion', 'Min. PINS-Version', entry.minPinsVersion, current.payload?.backend?.pinsVersion || '')}`
          : '';

        const note = noteSection(i, d.userNote || '', entryNotes, off);

        return `
          <div class="block${taken ? ' done' : ''}" id="dev${i}">
            <div class="block-head">
              <strong>${esc(d.displayName || d.name || '(ohne Namen)')}</strong>
              <span class="chip">${esc(d.userStatus || '?')}</span>
            </div>
            ${head}
            ${form}
            ${deviceDiff || aliasRow || entryDiff ? '<h3>Unterschiede</h3>' : ''}
            ${deviceDiff}${aliasRow}${entryDiff}
            ${note}
            <div class="row-actions">
              <button class="primary small" id="take${i}" ${off}>
                ${taken ? '✓ übernommen' : 'Dieses Gerät übernehmen'}
              </button>
            </div>
          </div>`;
      }

      /**
       * The incoming note next to whatever is already on record. Discarding is
       * preselected once notes exist — the same observation arriving again is
       * the normal case, and appending it would grow the list with repetitions.
       */
      function noteSection(i, incoming, existing, off) {
        if (!incoming && !existing.length) return '';

        const list = existing
          .map((n) => `<div class="existing-note">${esc(n.text)}</div>`)
          .join('');

        if (!incoming) {
          return `<h3>Vorhandene Notizen</h3>${list}`;
        }

        const replaceOptions = existing
          .map((n) => `<option value="${n.id}">${esc(n.text.slice(0, 60))}</option>`)
          .join('');

        return `
          <h3>Notiz</h3>
          ${list}
          <textarea id="note${i}" rows="2" ${off}>${esc(incoming)}</textarea>
          <div class="choice" id="noteChoice${i}">
            <label>
              <input type="radio" name="note${i}" value="add" ${existing.length ? '' : 'checked'} ${off} />
              Hinzufügen
            </label>
            ${
              existing.length
                ? `<label>
                     <input type="radio" name="note${i}" value="replace" ${off} /> Ersetzt
                   </label>
                   <select id="noteTarget${i}" ${off}>${replaceOptions}</select>
                   <label>
                     <input type="radio" name="note${i}" value="drop" checked ${off} /> Verwerfen
                   </label>`
                : `<label>
                     <input type="radio" name="note${i}" value="drop" ${off} /> Verwerfen
                   </label>`
            }
          </div>`;
      }

      /** Publishes exactly one device of the open submission. */
      async function takeDevice(i) {
        const card = $('dev' + i);
        const btn = $('take' + i);
        btn.disabled = true;
        toast('');

        try {
          const vendor = $('vendor' + i).value.trim();
          const model = $('model' + i).value.trim();
          const slug = $('slug' + i).value.trim();
          const category = $('cat' + i).value;
          const driver = $('drv' + i).value.trim();
          const status = $('st' + i).value;
          const stack = $('stack' + i).value;

          if (!slug || !model || !driver) {
            throw new Error('Slug, Model und Treiber dürfen nicht leer sein.');
          }

          // The link select is the reviewer's override of the automatic match:
          // an empty value forces a new device even when something looked alike.
          const linkSelect = $('link' + i);
          const linkedId = linkSelect ? linkSelect.value : '';
          let device = linkedId ? devices.find((d) => d.id === linkedId) : null;
          const done = [];
          const now = new Date().toISOString();

          if (device) {
            const patch = {};
            if (choice(card, 'vendor') === 'take' && vendor !== device.vendor)
              patch.vendor = vendor;
            if (choice(card, 'model') === 'take' && model !== device.model) patch.model = model;
            if (choice(card, 'slug') === 'take' && slug !== device.slug) patch.slug = slug;
            if (choice(card, 'category') === 'take' && category !== device.category) {
              patch.category = category;
            }

            const incomingName = stripHardwareSuffix(
              current.payload?.devices?.[i]?.displayName ||
                current.payload?.devices?.[i]?.name ||
                ''
            );
            if (choice(card, 'alias', 'keep') === 'take' && incomingName) {
              const aliases = Array.isArray(device.aliases) ? [...device.aliases] : [];
              if (!aliases.some((a) => normalizeName(a) === normalizeName(incomingName))) {
                aliases.push(incomingName);
                patch.aliases = aliases;
                done.push('Alias ergänzt');
              }
            }

            if (Object.keys(patch).length) {
              device = await api(`/api/collections/hw_devices/records/${device.id}`, {
                method: 'PATCH',
                body: JSON.stringify(patch),
              });
              const changed = Object.keys(patch).filter((k) => k !== 'aliases');
              if (changed.length) done.push(`Gerät aktualisiert: ${changed.join(', ')}`);
            }
          } else {
            device = await api('/api/collections/hw_devices/records', {
              method: 'POST',
              body: JSON.stringify({ slug, category, vendor, model, aliases: [] }),
            });
            done.push(`Gerät angelegt: ${slug}`);
          }

          // Same driver under a different stack is a different entry: PHD2 has
          // its own driver list, so the two say nothing about each other.
          const existing = await findOne(
            'hw_entries',
            `device='${q(device.id)}' && driver='${q(driver)}' && ` +
              (stack === 'pins' ? `(stack='pins' || stack='')` : `stack='${q(stack)}'`)
          );
          let entryId;

          if (existing) {
            const count = (existing.reportCount || 0) + 1;
            const patch = { reportCount: count, lastConfirmed: now };
            // Without an explicit decision the stored status stands: one
            // dissenting report must not overturn a widely confirmed result.
            if (choice(card, 'status') === 'take') patch.status = status;
            if (choice(card, 'stack') === 'take') patch.stack = stack;
            if (choice(card, 'minPinsVersion') === 'take') {
              patch.minPinsVersion = current.payload?.backend?.pinsVersion || '';
            }
            await api(`/api/collections/hw_entries/records/${existing.id}`, {
              method: 'PATCH',
              body: JSON.stringify(patch),
            });
            entryId = existing.id;
            done.push(
              patch.status ? `Status → ${patch.status}` : 'Status behalten',
              `jetzt ${count} Meldungen`
            );
          } else {
            const created = await api('/api/collections/hw_entries/records', {
              method: 'POST',
              body: JSON.stringify({
                device: device.id,
                driver,
                status,
                stack,
                reportCount: 1,
                lastConfirmed: now,
                minPinsVersion: current.payload?.backend?.pinsVersion || '',
              }),
            });
            entryId = created.id;
            done.push(`Eintrag angelegt: ${driver} (${stack})`);
          }

          await applyNote(i, entryId, done);

          takenDevices.add(i);
          // The published data changed; reload so a second device in the same
          // submission is matched against the new state.
          await loadEntries();
          renderDetail();
          toast(done.join(' · ') || 'Übernommen', 'ok');
        } catch (err) {
          toast('Fehlgeschlagen: ' + err.message, 'err');
          btn.disabled = false;
        }
      }

      async function applyNote(i, entryId, done) {
        const field = $('note' + i);
        if (!field) return;

        const text = field.value.trim();
        if (!text) return;

        const selected = document.querySelector(`input[name="note${i}"]:checked`);
        const mode = selected?.value || 'add';
        if (mode === 'drop') {
          done.push('Notiz verworfen');
          return;
        }

        if (mode === 'replace') {
          const targetId = $('noteTarget' + i)?.value;
          if (targetId) {
            await api(`/api/collections/hw_notes/records/${targetId}`, {
              method: 'PATCH',
              body: JSON.stringify({ text }),
            });
            done.push('Notiz ersetzt');
            return;
          }
        }

        await api('/api/collections/hw_notes/records', {
          method: 'POST',
          body: JSON.stringify({
            entry: entryId,
            text,
            lang: current.payload?.client?.locale || 'en',
          }),
        });
        done.push('Notiz hinzugefügt');
      }

      async function setStatus(status) {
        try {
          await api(`/api/collections/hw_submissions/records/${current.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status }),
          });
          const label = {
            approved: 'abgeschlossen',
            rejected: 'abgelehnt',
            duplicate: 'als Duplikat markiert',
          };
          toast(`${current.reportToken} ${label[status]}`, 'ok');
          current = null;
          await loadPending();
        } catch (err) {
          toast('Statuswechsel fehlgeschlagen: ' + err.message, 'err');
        }
      }

      /* ---------- published entries ---------- */

      async function loadEntries() {
        toast('');
        try {
          const [d, e, n] = await Promise.all([
            api('/api/collections/hw_devices/records?perPage=500&sort=vendor,model'),
            api('/api/collections/hw_entries/records?perPage=500'),
            api('/api/collections/hw_notes/records?perPage=500'),
          ]);
          devices = d.items || [];
          entries = e.items || [];
          notes = n.items || [];
          renderDeviceList();
          if (currentDeviceId) renderEntryDetail();
        } catch (err) {
          toast('Laden fehlgeschlagen: ' + err.message, 'err');
        }
      }

      $('deviceSearch').addEventListener('input', renderDeviceList);

      function renderDeviceList() {
        const needle = $('deviceSearch').value.trim().toLowerCase();
        const shown = devices.filter((d) =>
          needle ? `${d.vendor} ${d.model} ${d.slug}`.toLowerCase().includes(needle) : true
        );

        $('deviceCount').textContent = devices.length;
        const list = $('deviceList');
        list.innerHTML = '';
        if (!shown.length) {
          list.innerHTML = '<p class="empty">Keine Geräte gefunden.</p>';
          return;
        }
        shown.forEach((d) => {
          const b = document.createElement('button');
          const count = entries.filter((e) => e.device === d.id).length;
          b.innerHTML =
            `<span>${esc([d.vendor, d.model].filter(Boolean).join(' '))}</span>` +
            `<span class="tok">${esc(d.category)} · ${count} Treiber</span>`;
          b.onclick = () => {
            currentDeviceId = d.id;
            renderDeviceList();
            renderEntryDetail();
          };
          if (currentDeviceId === d.id) b.classList.add('active');
          list.appendChild(b);
        });
      }

      function renderEntryDetail() {
        const device = devices.find((d) => d.id === currentDeviceId);
        if (!device) {
          $('entryDetail').innerHTML = '<div class="card empty">Links ein Gerät auswählen.</div>';
          return;
        }

        const aliases = Array.isArray(device.aliases) ? device.aliases.join(', ') : '';
        const deviceEntries = entries.filter((e) => e.device === device.id);

        const entryBlocks = deviceEntries
          .map((e) => {
            const entryNotes = notes.filter((n) => n.entry === e.id);
            const noteFields = entryNotes
              .map(
                (n) => `
                <div class="full">
                  <label>Notiz (${esc(n.lang || '?')})</label>
                  <textarea id="ntext_${n.id}" rows="2">${esc(n.text)}</textarea>
                  <div class="row-actions">
                    <button class="small" id="nsave_${n.id}">Notiz speichern</button>
                    <button class="danger small" id="ndel_${n.id}">Notiz löschen</button>
                  </div>
                </div>`
              )
              .join('');

            return `
            <div class="block">
              <div class="block-head">
                <strong>${esc(e.driver)}</strong>
                <span class="chip">${esc(stackOf(e.stack))}</span>
              </div>
              <div class="grid">
                <div><label>Treiber</label><input id="edrv_${e.id}" value="${esc(e.driver)}" /></div>
                <div><label>Status</label><select id="est_${e.id}">${options(STATUSES, e.status)}</select></div>
                <div><label>Stack</label><select id="estk_${e.id}">${options(STACKS, stackOf(e.stack))}</select></div>
                <div><label>Meldungen</label><input id="ecnt_${e.id}" type="number" min="0" value="${Number(e.reportCount) || 0}" /></div>
                <div><label>Min. PINS-Version</label><input id="epv_${e.id}" value="${esc(e.minPinsVersion || '')}" /></div>
                ${noteFields || '<p class="empty full">Keine Notizen.</p>'}
              </div>
              <div class="row-actions">
                <button class="primary small" id="esave_${e.id}">Treiber-Eintrag speichern</button>
                <button class="danger small" id="edel_${e.id}">Treiber-Eintrag löschen</button>
              </div>
            </div>`;
          })
          .join('');

        $('entryDetail').innerHTML = `
          <div class="card">
            <h2>${esc([device.vendor, device.model].filter(Boolean).join(' '))}</h2>
            <div class="grid">
              <div><label>Vendor</label><input id="dvendor" value="${esc(device.vendor)}" /></div>
              <div><label>Model</label><input id="dmodel" value="${esc(device.model)}" /></div>
              <div><label>Slug</label><input id="dslug" value="${esc(device.slug)}" /></div>
              <div><label>Kategorie</label><select id="dcat">${options(CATEGORIES, device.category)}</select></div>
              <div class="full">
                <label>Aliase (kommagetrennt)</label>
                <input id="daliases" value="${esc(aliases)}" />
              </div>
            </div>
            <div class="row-actions">
              <button class="primary small" id="dsave">Gerät speichern</button>
              <button class="danger small" id="ddel">Gerät löschen</button>
            </div>

            <h3>Treiber (${deviceEntries.length})</h3>
            ${entryBlocks || '<p class="empty">Für dieses Gerät ist kein Treiber erfasst.</p>'}
          </div>`;

        $('dsave').onclick = () => saveDevice(device.id);
        $('ddel').onclick = () => removeDevice(device);
        deviceEntries.forEach((e) => {
          $('esave_' + e.id).onclick = () => saveEntry(e.id);
          $('edel_' + e.id).onclick = () => removeEntry(e);
          notes
            .filter((n) => n.entry === e.id)
            .forEach((n) => {
              $('nsave_' + n.id).onclick = () => saveNote(n.id);
              $('ndel_' + n.id).onclick = () => removeNote(n.id);
            });
        });
      }

      /* ---------- deleting published data ---------- */

      async function remove(collection, id, label) {
        try {
          await api(`/api/collections/${collection}/records/${id}`, { method: 'DELETE' });
          toast(`${label} gelöscht.`, 'ok');
          await loadEntries();
        } catch (err) {
          toast('Löschen fehlgeschlagen: ' + err.message, 'err');
        }
      }

      /**
       * Both relations are cascadeDelete, so removing a device takes its whole
       * subtree with it. The prompt names the count rather than saying
       * "and related records" - that is what makes it a real warning.
       */
      function removeDevice(device) {
        const deviceEntries = entries.filter((e) => e.device === device.id);
        const noteCount = notes.filter((n) => deviceEntries.some((e) => e.id === n.entry)).length;
        const name = [device.vendor, device.model].filter(Boolean).join(' ');

        if (
          !confirm(
            `"${name}" endgültig löschen?\n\n` +
              `Mit gelöscht werden ${deviceEntries.length} Treiber-Eintrag/-Einträge ` +
              `und ${noteCount} Notiz(en). Das lässt sich nicht rückgängig machen.`
          )
        ) {
          return;
        }
        currentDeviceId = '';
        remove('hw_devices', device.id, name);
      }

      function removeEntry(entry) {
        const noteCount = notes.filter((n) => n.entry === entry.id).length;
        if (
          !confirm(
            `Treiber-Eintrag "${entry.driver}" löschen?\n\n` +
              `Mit gelöscht werden ${noteCount} Notiz(en).`
          )
        ) {
          return;
        }
        remove('hw_entries', entry.id, entry.driver);
      }

      function removeNote(id) {
        if (!confirm('Diese Notiz löschen?')) return;
        remove('hw_notes', id, 'Notiz');
      }

      async function saveDevice(id) {
        try {
          const aliases = $('daliases')
            .value.split(',')
            .map((a) => a.trim())
            .filter(Boolean);

          await api(`/api/collections/hw_devices/records/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({
              vendor: $('dvendor').value.trim(),
              model: $('dmodel').value.trim(),
              slug: $('dslug').value.trim(),
              category: $('dcat').value,
              aliases,
            }),
          });
          toast('Gerät gespeichert.', 'ok');
          await loadEntries();
        } catch (err) {
          toast('Speichern fehlgeschlagen: ' + err.message, 'err');
        }
      }

      async function saveEntry(id) {
        try {
          await api(`/api/collections/hw_entries/records/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({
              driver: $('edrv_' + id).value.trim(),
              status: $('est_' + id).value,
              stack: $('estk_' + id).value,
              reportCount: Number($('ecnt_' + id).value) || 0,
              minPinsVersion: $('epv_' + id).value.trim(),
            }),
          });
          toast('Treiber-Eintrag gespeichert.', 'ok');
          await loadEntries();
        } catch (err) {
          toast('Speichern fehlgeschlagen: ' + err.message, 'err');
        }
      }

      async function saveNote(id) {
        try {
          await api(`/api/collections/hw_notes/records/${id}`, {
            method: 'PATCH',
            body: JSON.stringify({ text: $('ntext_' + id).value.trim() }),
          });
          toast('Notiz gespeichert.', 'ok');
          await loadEntries();
        } catch (err) {
          toast('Speichern fehlgeschlagen: ' + err.message, 'err');
        }
      }

      /* ---------- boot ---------- */

      if (token) {
        showApp();
        loadPending().catch(() => {
          token = '';
          sessionStorage.removeItem('hwReviewToken');
          location.reload();
        });
      }
    </script>
  </body>
</html>
